<!DOCTYPE html>
<html lang="en">

<head>
    <title>101zh</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/font.css">
    <link rel="stylesheet" href="../css/on-hover-up.css">
    <link rel="stylesheet" href="../css/animated-underline.css">
    <link rel="stylesheet" href="../css/lab-modal.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <div class="backButton animated-underline">
            <a href="../">
                < Back</a>
        </div>
        <h1 class="title">Networking Labs</h1>
        <div id="pagedescrip" class="subscript">Documentation and write-ups for various networking and cybersecurity
            related
            configurations</div>
        <div style="font-weight: bold;" class="subscript">Click on one to see the full report!</div>
    </div>

    <div id="container">
    </div>

    <div id="labModal" class="modal">
        <div class="modal-content">
            <div class="close-button-container animated-underline"><span class="close-button">&times;</span></div>
            <div id="modal-details">
                <!-- <div class="modal-left-nav">
                    <
                </div> -->
                <div id="modal-left">
                    <h2 id="modal-title">Configuring SOHO for a Fortigate 40F</h2>
                    <div class="modal-image-container">
                        <img id="modal-image" src="">
                    </div>
                </div>
                <div id="modal-right">
                    <p id="modal-purpose"></p>
                    <div class="modal-button-group">
                        <a href="" target="_blank" rel="noopener noreferrer" class="modalButton" id="repo-link">
                            <div class="on-hover-up animated-underline">
                                <div class="modalButtonSymbol"><img src="../assets/symbols/repository-symbol.svg">
                                </div>
                                <div class="modal-button-text">View Repo</div>
                            </div>
                        </a>
                        <a href="" target="_blank" class="modalButton" id="write-up-link">
                            <div class="on-hover-up animated-underline">
                                <div class="modalButtonSymbol"><img src="../assets/symbols/document-symbol.svg">
                                </div>
                                <div class="modal-button-text">View Write-up</div>
                            </div>
                        </a>
                    </div>
                    <div class="modal-button-group modal-nav-group">
                        <div class="modalButton" id="modal-prev">
                            <div class="on-hover-up modal-button-text animated-underline">
                                < Prev</div>
                            </div>
                            <div class="modalButton" id="modal-next">
                                <div class="on-hover-up modal-button-text animated-underline">Next ></div>
                            </div>
                        </div>
                    </div>
                    <!-- <div class="modal-right-nav">
                    >
                </div> -->
                </div>
            </div>
        </div>
    </div>

</body>

<script src="script.js"></script>

</html>
